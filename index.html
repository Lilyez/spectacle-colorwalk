<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>가을 컬러워크</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
@font-face{font-family:'KIMWILDgag-Bold';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2510-1@1.0/KIMWILDgag-Bold.woff2') format('woff2');font-weight:normal;font-display:swap}
:root{
  --bg:#F7F2EA; --paper:#FFFDF9; --ink:#3B2F27; --sub:#8C7D70; --line:#E7DCCC; --soft:#EFE6DA;
  --c:#3B2F27;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.leaf{width:22px;height:22px;flex:none}

/* ---------- home ---------- */
.home{padding:48px 16px 40px}
.home{position:relative}
.home h1{font-family:'KIMWILDgag-Bold',sans-serif;font-weight:normal;font-size:64px;line-height:1.1}
.me{position:absolute;top:14px;right:16px;font-size:13px;font-weight:700;color:var(--sub);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.grp{font-size:14px;font-weight:800;color:var(--sub);margin:22px 2px 10px}
.grp:first-of-type{margin-top:0}
.rgrp{font-size:14px;font-weight:800;color:var(--sub);padding:32px 16px 0;margin-bottom:-12px}
.join-form{display:grid;gap:10px;margin-top:8px}
.join-form input{height:56px;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:0 18px;font-size:17px;color:var(--ink);outline:none}
.join-form input:focus{border-color:var(--ink)}
.join-form .ghost{margin-top:0;width:100%;border:0;cursor:pointer}
.foot{padding:44px 0 8px;text-align:center}
.foot img{height:22px;width:auto;opacity:.9;display:block;margin:0 auto}
.admin-link{display:block;margin:10px auto 0;padding:6px 10px;font-size:11px;color:#B5AA9E;letter-spacing:.02em}
.adminbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:8px 8px 8px 14px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.adminbar button{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.del{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(20,14,8,.7);color:#fff;font-size:18px;line-height:28px;text-align:center;z-index:2}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,14,8,.5);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal-box{background:var(--bg);width:100%;max-width:320px;border-radius:16px;padding:22px 18px 16px}
.modal-box h3{font-size:17px;font-weight:800;text-align:center;margin-bottom:14px}
.modal-box input{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 14px;font-size:16px;color:var(--ink);outline:none;margin-bottom:12px}
.modal-box input:focus{border-color:var(--ink)}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;height:46px;border-radius:10px;font-weight:700;font-size:15px;background:var(--line)}
.modal-btns .ok{background:var(--ink);color:#fff}
.modal-btns .ok.danger{background:#B3392A}
.modal-err{color:#B3392A;font-size:13px;text-align:center;margin:-4px 0 10px}
html,body{overscroll-behavior-y:contain}
.stripe{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:28px 0 28px}
.stripe i{flex:1}
.teams{list-style:none;display:grid;gap:10px}
.teams a{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px 14px 14px;transition:transform .15s}
.teams a:active{transform:scale(.98)}
.teams .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.teams .dot .leaf{fill:#fff;color:rgba(0,0,0,.25)}
.teams .name{font-family:'KIMWILDgag-Bold',sans-serif;font-weight:normal;font-size:26px;line-height:1;transform:translateY(-.11em)}
.teams .cnt{margin-left:auto;font-size:13px;color:var(--sub)}
.teams .cnt b{color:var(--ink);font-size:17px;font-weight:800;margin-right:1px}
.ghost{display:block;margin-top:24px;padding:16px;text-align:center;background:var(--ink);color:#fff;border-radius:14px;font-weight:700;font-size:16px}

/* ---------- team ---------- */
.hero{background:var(--c);color:#fff;min-height:180px;padding:52px 16px 18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.hero .leafbg{position:absolute;right:-26px;top:-26px;width:150px;height:150px;fill:rgba(255,255,255,.14);color:transparent;transform:rotate(25deg)}
.back{position:absolute;left:6px;top:8px;width:44px;height:44px;display:grid;place-items:center;font-size:26px;color:inherit;z-index:1}
.hero h1{font-family:'KIMWILDgag-Bold',sans-serif;font-weight:normal;font-size:52px;line-height:1.1}
.gallery{padding:2px 0 120px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pola{display:block;background:var(--soft)}
.pola img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pola:active img{opacity:.85}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--sub);font-weight:600}
.pola.up img{opacity:.5}
.pola.up::after{content:'';position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pola{position:relative}
.upbar{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:15;white-space:nowrap}
.sk{aspect-ratio:1;background:var(--soft);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.45}}
.empty .leaf{width:44px;height:44px;fill:none;stroke:var(--c);stroke-width:1;opacity:.6;margin-bottom:10px}
.cta{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(247,242,234,0))}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:14px;background:var(--c);color:#fff;font-weight:800;font-size:17px}
.btn:disabled{opacity:.5}
.btn .leaf{width:18px;height:18px;fill:#fff;color:var(--c)}


/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;background:rgba(20,14,8,.92);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.lb img{max-width:100%;max-height:72vh;border-radius:4px}
.lb .cap{color:rgba(255,255,255,.75);font-size:13px;font-weight:600;margin-top:12px}

/* ---------- result ---------- */
.res-head{padding:60px 16px 8px;position:relative}
.res-head h1{font-family:'KIMWILDgag-Bold',sans-serif;font-weight:normal;font-size:64px;line-height:1.1}
.ratio{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:24px 16px 8px;background:var(--line)}
.ratio i{transition:flex .4s}
.legend{display:flex;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:4px}
.legend em{width:8px;height:8px;border-radius:50%;display:inline-block}
.mosaic{display:grid;grid-template-columns:repeat(5,1fr);margin:24px 0 0}
.mosaic div{aspect-ratio:1;position:relative;overflow:hidden}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic div::after{content:'';position:absolute;inset:0;background:var(--c);mix-blend-mode:soft-light;opacity:.35}
.mosaic .ph{background:var(--c);opacity:.25}
.rsec{padding:28px 16px 0}
.rsec h2{display:flex;align-items:center;gap:8px;font-family:'KIMWILDgag-Bold',sans-serif;font-weight:normal;font-size:24px;margin-bottom:12px}
.rsec h2 em{width:12px;height:12px;border-radius:50%}
.rsec h2 .nm{transform:translateY(-.11em)}
.rsec h2 small{margin-left:auto;font-family:'Pretendard',sans-serif;font-size:14px;color:var(--sub);font-weight:600}
.row{display:flex;gap:2px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .pola{width:104px;flex:none}
.row .none{font-size:13px;color:var(--sub);padding:20px 0}
.res-foot{padding:32px 16px 48px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
// 색(앨범)과 조. 조마다 색 여러 개를 맡는다
const TEAMS = {
  red:    {ko:'빨강', c:'#C0432F'},
  orange: {ko:'주황', c:'#D9772F'},
  yellow: {ko:'노랑', c:'#D4A11E'},
  khaki:  {ko:'카키', c:'#6E7343'},
};
const GROUPS = [
  { name: '1조', colors: ['red', 'orange'] },
  { name: '2조', colors: ['yellow', 'khaki'] },
];
const ORDER = GROUPS.flatMap(g => g.colors);

const LEAF = '<path d="M12 1.5c4.6 3.4 7.5 7.6 7.5 11.6a7.5 7.5 0 0 1-15 0c0-4 2.9-8.2 7.5-11.6z"/><path d="M12 6.5V23" fill="none" stroke="currentColor" stroke-width="1"/>';
const leaf = (cls='leaf') => `<svg class="${cls}" viewBox="0 0 24 24">${LEAF}</svg>`;

/* ---------- 저장소 ----------
   ENDPOINT에 Apps Script 웹앱 주소를 넣으면 구글 드라이브에 저장된다.
   비워두면 이 기기(IndexedDB)에만 저장 — 화면 확인용. */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxeaoaieK2v9Vu5wZD-GnrM_sdYasK_hkJ-r3V1KySqw0mFZCA9CenowauUdkc2GJKyfQ/exec';

const toBase64 = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
const byNewest = list => list.sort((a, b) => b.createdAt - a.createdAt);

const DB = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open('colorhunt', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const q = fn(db.transaction('photos', mode).objectStore('photos'));
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  }); };
  return { all: () => tx('readonly', s => s.getAll()), put: v => tx('readwrite', s => s.put(v)), del: id => tx('readwrite', s => s.delete(id)) };
})();

const API = ENDPOINT ? {
  async list() {
    try { return byNewest(await (await fetch(ENDPOINT)).json()); }
    catch (e) { console.error(e); return null; }
  },
  async upload(team, blob, name) {
    const data = (await toBase64(blob)).split(',')[1];
    // text/plain으로 보내야 Apps Script에서 CORS 사전요청 없이 받는다
    const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ team, data, name }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    return j;
  },
  async admin(body) {
    const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: AbortSignal.timeout(45000) });
    return r.json();
  },
} : {
  async list() { return byNewest(await DB.all()); },
  async upload(team, blob, name) {
    const item = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 8), team, name, url: await toBase64(blob), createdAt: Date.now() };
    await DB.put(item); return item;
  },
  async admin(body) { if (body.action === 'delete') await DB.del(body.id); return { ok: true }; },
};

// 드라이브 사진은 id로 크기별 이미지를 받는다
const src = (p, w) => p.url || `https://lh3.googleusercontent.com/d/${p.id}=w${w}`;

/* ---------- 업로드 전 압축 (긴 변 1400px) ---------- */
function compress(file, max = 1400, q = 0.8) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(u);
      cv.toBlob(b => b ? res(b) : rej(new Error('압축 실패')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('이미지를 읽을 수 없어요')); };
    img.src = u;
  });
}

/* ---------- utils ---------- */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const local = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
let myName = local.get('cw-name');
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
}
const setTheme = t => document.documentElement.style.setProperty('--c', t ? TEAMS[t].c : '#3B2F27');
const counts = list => ORDER.reduce((o, k) => (o[k] = list.filter(p => p.team === k).length, o), {});

/* ---------- 홈 ---------- */
function renderHome(list) {
  setTheme(null);
  const n = list && counts(list);
  $app.innerHTML = `
  <main class="home">
    <button class="me">${esc(myName)}</button>
    <h1>가을<br>컬러워크</h1>
    <div class="stripe">${ORDER.map(k => `<i style="background:${TEAMS[k].c}"></i>`).join('')}</div>
    ${GROUPS.map(g => `
    <h2 class="grp">${g.name}</h2>
    <ul class="teams">
      ${g.colors.map(k => { const t = TEAMS[k]; return `
      <li><a href="#/team/${k}">
        <span class="dot" style="background:${t.c}">${leaf()}</span>
        <span class="name">${t.ko}</span>
        <span class="cnt">${n ? `<b>${n[k]}</b>장` : ''}</span>
      </a></li>`; }).join('')}
    </ul>`).join('')}
    <a class="ghost" href="#/result">전체 모아보기</a>
    ${foot()}
  </main>`;
}

/* ---------- 조 페이지 ---------- */
function renderTeam(k, list) {
  const t = TEAMS[k]; setTheme(k);
  const mine = [...pending.filter(p => p.team === k), ...(list || []).filter(p => p.team === k)];
  $app.innerHTML = `
  <header class="hero">
    <a class="back" href="#/">‹</a>
    ${leaf('leafbg')}
    <h1>${t.ko}</h1>
  </header>
  <section class="gallery">
    ${!list && !mine.length ? '<div class="sk"></div>'.repeat(6) : mine.length ? mine.map(p => `<button class="pola${p.up ? ' up' : ''}" data-id="${p.id}"><img src="${src(p, 500)}" alt="" loading="lazy">${delBtn(p)}</button>`).join('')
      : `<div class="empty">${leaf()}<div>아직 사진이 없어요</div></div>`}
  </section>
  <div class="cta"><label class="btn">${leaf()} 사진 올리기<input type="file" accept="image/*" multiple hidden></label></div>`;

  $app.querySelectorAll('.pola:not(.up)').forEach(b => b.onclick = () => openLightbox(mine.find(p => p.id === b.dataset.id)));
  $app.querySelector('input[type=file]').onchange = e => { const files = [...e.target.files]; e.target.value = '';
    if (files.length) startUpload(k, files.map((f, i) => ({ id: 'up-' + Date.now() + '-' + i, team: k, url: URL.createObjectURL(f), up: true, file: f }))); };
}

/* ---------- 업로드: 고른 사진을 바로 보여주고 뒤에서 3장씩 동시에 올린다 ---------- */
const pending = [];
let upTotal = 0, upDone = 0, upFail = 0;
function upbar() {
  let el = document.querySelector('.upbar');
  if (!pending.length) { el?.remove(); return; }
  if (!el) { el = document.createElement('div'); el.className = 'upbar'; document.body.appendChild(el); }
  el.textContent = `사진 올리는 중 ${upDone}/${upTotal}`;
}
async function startUpload(team, items) {
  pending.unshift(...items); upTotal += items.length; upbar(); paint();
  let i = 0;
  const worker = async () => {
    while (i < items.length) {
      const it = items[i++];
      try {
        const saved = await API.upload(team, await compress(it.file), myName);
        cache = [saved, ...(cache || [])];
      } catch (err) { console.error(err); upFail++; }
      pending.splice(pending.indexOf(it), 1); URL.revokeObjectURL(it.url);
      upDone++; upbar();
      if (!document.querySelector('.lb')) paint();
    }
  };
  await Promise.all(Array.from({ length: Math.min(3, items.length) }, worker));
  if (!pending.length) {
    toast(upFail ? `${upFail}장은 올리지 못했어요` : '업로드 완료!');
    upTotal = upDone = upFail = 0; upbar();
  }
}
window.addEventListener('beforeunload', e => { if (pending.length) { e.preventDefault(); e.returnValue = ''; } });

function openLightbox(p) {
  if (!p) return;
  const el = document.createElement('div'); el.className = 'lb';
  el.innerHTML = `<img src="${src(p, 1600)}" alt="">${p.name ? `<div class="cap">${esc(p.name)}</div>` : ''}`;
  el.onclick = () => el.remove();
  document.body.appendChild(el);
}

/* ---------- 전체 결과 ---------- */
function renderResult(data) {
  setTheme(null);
  const list = data || [], n = counts(list);
  const byTeam = k => list.filter(p => p.team === k);
  const tiles = ORDER.flatMap(k => byTeam(k).map(p => ({ k, p })));
  if (!tiles.length) ORDER.forEach(k => tiles.push(...Array(4).fill({ k })));
  $app.innerHTML = `
  <header class="res-head">
    <a class="back" href="#/">‹</a>
    <h1>우리의 가을</h1>
  </header>
  <div class="ratio">${ORDER.map(k => `<i style="background:${TEAMS[k].c};flex:${n[k]}"></i>`).join('')}</div>
  <div class="legend">${ORDER.map(k => `<span><em style="background:${TEAMS[k].c}"></em>${TEAMS[k].ko} ${n[k]}</span>`).join('')}</div>
  <div class="mosaic">${tiles.map(({ k, p }) => p
      ? `<div style="--c:${TEAMS[k].c}"><img src="${src(p, 300)}" alt="" loading="lazy"></div>`
      : `<div class="ph" style="--c:${TEAMS[k].c}"></div>`).join('')}</div>
  ${ORDER.map(k => { const t = TEAMS[k], ps = byTeam(k), g = GROUPS.find(g => g.colors[0] === k); return `${g ? `<h3 class="rgrp">${g.name}</h3>` : ''}
  <section class="rsec" style="--c:${t.c}">
    <h2><em style="background:${t.c}"></em><span class="nm">${t.ko}</span><small>${ps.length}장</small></h2>
    <div class="row">${ps.length ? ps.map(p => `<button class="pola" data-id="${p.id}"><img src="${src(p, 400)}" alt="" loading="lazy">${delBtn(p)}</button>`).join('') : '<span class="none">—</span>'}</div>
  </section>`; }).join('')}
  <div class="res-foot">${foot()}</div>`;
  $app.querySelectorAll('.pola').forEach(b => b.onclick = () => {
    const p = list.find(x => x.id === b.dataset.id); setTheme(p.team); openLightbox(p);
  });
}

/* ---------- 관리자: 비밀번호 확인 후 사진 삭제 ---------- */
const session = {
  get: k => { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} },
};
let adminPw = session.get('ch-admin');
const foot = () => `<footer class="foot"><img src="https://cdn.imweb.me/thumbnail/20250530/1404a29fb35b3.png" alt="인천 스펙타클"><button class="admin-link">Admin</button></footer>`;
const delBtn = p => adminPw && !p.up ? `<span class="del" data-del="${p.id}">×</span>` : '';

// 작은 확인 창: input이 있으면 입력값을, 없으면 true를 돌려준다 (취소는 null)
function ask({ title, input, ok = '확인', danger, check }) {
  return new Promise(resolve => {
    const el = document.createElement('div'); el.className = 'modal';
    el.innerHTML = `<div class="modal-box"><h3>${title}</h3>${input ? `<input type="${input}" autocomplete="off">` : ''}<div class="modal-err" hidden></div>
      <div class="modal-btns"><button class="no">취소</button><button class="ok${danger ? ' danger' : ''}">${ok}</button></div></div>`;
    document.body.appendChild(el);
    const inp = el.querySelector('input'), err = el.querySelector('.modal-err'), okBtn = el.querySelector('.ok');
    const done = v => { el.remove(); resolve(v); };
    const submit = async () => {
      const v = inp ? inp.value : true;
      if (inp && !v) return;
      if (check) {
        okBtn.disabled = true; okBtn.textContent = '확인 중…';
        const msg = await check(v);
        okBtn.disabled = false; okBtn.textContent = ok;
        if (msg) { err.textContent = msg; err.hidden = false; inp?.select(); return; }
      }
      done(v);
    };
    el.querySelector('.no').onclick = () => done(null);
    el.onclick = e => { if (e.target === el) done(null); };
    okBtn.onclick = submit;
    inp?.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    inp?.focus();
  });
}

function bindAdmin() {
  const me = $app.querySelector('.me');
  if (me) me.onclick = async () => {
    const v = await ask({ title: '이름', input: 'text', ok: '바꾸기' });
    if (v && v.trim()) { myName = v.trim(); local.set('cw-name', myName); paint(); }
  };
  document.querySelector('.adminbar')?.remove();
  if (adminPw) {
    const bar = document.createElement('div'); bar.className = 'adminbar';
    bar.innerHTML = '관리자 모드<button>나가기</button>';
    bar.querySelector('button').onclick = () => { adminPw = ''; session.set('ch-admin', ''); paint(); };
    document.body.appendChild(bar);
  }
  const link = $app.querySelector('.admin-link');
  if (link) link.onclick = async () => {
    if (adminPw) return;
    const pw = await ask({ title: '관리자 비밀번호', input: 'password', check: async v => {
      try { return (await API.admin({ action: 'login', pw: v })).ok ? '' : '비밀번호가 맞지 않아요'; }
      catch { return '연결에 실패했어요'; }
    } });
    if (pw) { adminPw = pw; session.set('ch-admin', pw); paint(); }
  };
  $app.querySelectorAll('[data-del]').forEach(x => x.onclick = async e => {
    e.stopPropagation();
    const id = x.dataset.del;
    if (!await ask({ title: '이 사진을 삭제할까요?', ok: '삭제', danger: true })) return;
    x.closest('.pola').style.opacity = '.3';
    try {
      const r = await API.admin({ action: 'delete', pw: adminPw, id });
      if (!r.ok) throw new Error(r.error);
      cache = (cache || []).filter(p => p.id !== id); paint(); toast('삭제했어요');
    } catch (err) {
      console.error(err); x.closest('.pola').style.opacity = '';
      toast(String(err.message) === 'pw' ? '비밀번호를 다시 확인해 주세요' : '삭제하지 못했어요');
    }
  });
}

/* ---------- 아래로 당겨서 새로고침 (표시 없이 목록만 다시 불러온다) ---------- */
(() => {
  let startY = null, dist = 0;
  addEventListener('touchstart', e => {
    if (scrollY > 0 || document.querySelector('.lb,.modal')) return;
    startY = e.touches[0].clientY; dist = 0;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (startY === null) return;
    dist = e.touches[0].clientY - startY;
    if (dist < 0 || scrollY > 0) startY = null;
  }, { passive: true });
  addEventListener('touchend', () => {
    if (startY !== null && dist > 80) refresh();
    startY = null;
  });
})();

/* ---------- 라우터 ---------- */
// 화면은 가지고 있는 목록(cache)으로 바로 그리고, 새 목록이 오면 바뀐 경우에만 다시 그린다
let cache = null, current = null, shown = null, inflight = null;
const sigOf = l => l ? l.map(p => p.id).join() : null;
function paint() { shown = sigOf(cache); current(cache); upbar(); bindAdmin(); }
function refresh() {
  return inflight ||= API.list().then(list => {
    inflight = null;
    if (!list) return;
    cache = list;
    if (sigOf(cache) !== shown && !document.querySelector('.lb')) paint();
  });
}

// 처음 들어오면 이름을 적고 입장한다 (이 기기에 기억)
function renderJoin() {
  setTheme(null);
  $app.innerHTML = `
  <main class="home join">
    <h1>가을<br>컬러워크</h1>
    <div class="stripe">${ORDER.map(k => `<i style="background:${TEAMS[k].c}"></i>`).join('')}</div>
    <form class="join-form">
      <input name="nm" placeholder="이름" maxlength="20" autocomplete="name" required>
      <button class="ghost" type="submit">입장하기</button>
    </form>
    ${foot()}
  </main>`;
  $app.querySelector('form').onsubmit = e => {
    e.preventDefault();
    const v = e.target.nm.value.trim();
    if (!v) return;
    myName = v; local.set('cw-name', v); route();
  };
}

function route() {
  const q = new URLSearchParams(location.search).get('team');
  if (q && TEAMS[q] && !location.hash) history.replaceState(null, '', '#/team/' + q);
  const [, page, id] = (location.hash.slice(1) || '/').split('/');
  window.scrollTo(0, 0);
  current = !myName ? renderJoin : page === 'team' && TEAMS[id] ? l => renderTeam(id, l) : page === 'result' ? renderResult : renderHome;
  paint(); refresh();
}
window.addEventListener('hashchange', route);
route();

// 다른 사람이 올린 사진이 보이도록 20초마다 확인
setInterval(() => { if (!document.hidden) refresh(); }, 20000);
</script>
